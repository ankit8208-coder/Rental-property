<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentEase — Rental Property Management Portal</title>
  <meta name="description" content="Rental property search and management portal">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="toast" class="toast"></div>

<header class="site-header">
  <a class="brand" href="#" onclick="App.go('home');return false;"><span class="logo-mark">RE</span><span>RentEase</span></a>
  <nav id="guestNav">
    <a href="#" onclick="App.go('home');return false;">Home</a>
    <a href="#" onclick="App.go('properties');return false;">Find Properties</a>
    <a href="#" onclick="App.go('about');return false;">About</a>
    <button class="btn btn-ghost" onclick="App.openAuth('login')">Login</button>
    <button class="btn btn-primary" onclick="App.openAuth('register')">Get Started</button>
  </nav>
  <nav id="userNav" class="hidden">
    <span id="navUser" class="nav-user"></span>
    <button class="btn btn-ghost" onclick="App.go('dashboard')">Dashboard</button>
    <button class="btn btn-primary" onclick="App.logout()">Logout</button>
  </nav>
</header>

<main id="app"></main>

<div id="authModal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" onclick="App.closeAuth()">×</button>
    <div class="auth-head">
      <div class="eyebrow">RentEase</div>
      <h2 id="authTitle">Welcome back</h2>
      <p id="authSub">Sign in to your rental workspace.</p>
    </div>
    <div class="tabs">
      <button id="loginTab" class="tab active" onclick="App.authMode('login')">Login</button>
      <button id="registerTab" class="tab" onclick="App.authMode('register')">Register</button>
    </div>
    <form id="authForm"></form>
  </div>
</div>

<div id="propertyModal" class="modal hidden">
  <div class="modal-card large">
    <button class="modal-close" onclick="App.closePropertyModal()">×</button>
    <div id="propertyModalBody"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
